; The settings of Little Big Adventure. The game reads lba.cfg from the
; preferences, else where its files lie, else beside the program, else
; from the program's own copy of this text, and writes its changes into
; the preferences. Its keys are the CD's LBA.CFG's, set as the CD's
; setup program sets a Sound Blaster 16, then the twelve the port adds.

; The texts' language, English, Français, Deutsch, Español or Italiano
Language: English

; The voices' language, English, Français or Deutsch, or None
LanguageCD: English

; The texts shown with the voices, ON or OFF
FlagDisplayText: ON

; The voices copied from the CD kept in VOX, ON or OFF
FlagKeepVoice: OFF

; The video card's driver LBA.EXE loads, VESA for its own
SvgaDriver: VESA

; The music, NoMidi or a Sound Blaster 16's OPL3 (A32SP2FM.DLL) playing
; the FM tunes, or an AWE32 (A32GFX.DLL, its ROM awe32.raw in the
; preferences or the game's directory) playing the Midi tunes
MidiDriver: A32SP2FM.DLL

; A program LBA.EXE runs before the music's driver, or NoExec
MidiExec: NoExec

; The music card's port
MidiBase: 220h

; The tunes, FM or Midi
MidiType: FM

; The music card's IRQ and DMA, empty for a Sound Blaster 16
MidiIRQ: 
MidiDMA: 

; The samples and the voices, W_SB16.DLL or NoWave
WaveDriver: W_SB16.DLL

; A program LBA.EXE runs before the samples' driver, or NoExec
WaveExec: NoExec

; The sound card's port
WaveBase: 220h

; The sound card's IRQ and DMA, empty for a Sound Blaster 16
WaveIRQ: 
WaveDMA: 

; The samples' rate, 12000 to 22000 Hz
WaveRate: 22000

; The mixer, M_SB16.DLL or NoMixer
MixerDriver: M_SB16.DLL

; The mixer's port
MixerBase: 220h

; The volumes, 0 to 255
WaveVolume: 255
MusicVolume: 187
CDVolume: 216
LineVolume: 216
MasterVolume: 255

; LbaWin's settings, the sum of 1 the original game play at each start,
; 2 the bump into walls, 4 W the action in every behaviour, 8 the screen
; saver off whatever this says, 16 the fades at a change of scene, 32
; the arrows walking Twinsen the way they point on the screen, and on
; Windows 64 Alt+F4 refused and 128 the Windows keys on the whole display
LbaWinSettings: 212

; The whole display (1) or a window (0)
LbaWinFullScreen: 1

; LBA2's saves of the running scene and its menu in play, ON or OFF
SaveAnywhere: ON

; The tunes asked of the CD, CD (its tracks), Midi (the XMIDI) or Auto
; (the first of them the CD's directory holds)
MusicTracks: Auto

; The tunes asked of the XMIDI, Midi, PlayStation (its recordings on the
; CD), CD (cut from the CD's tracks) or Auto (the first the CD's directory
; holds of the cuts, the recordings and the XMIDI)
MusicJingles: Auto

; The screen 480 lines high and as wide as the display's shape (ON),
; or 640x480 (OFF)
WideScreen: ON

; Adeline's logo at the start passed by a key (ON), or shown whole
; (OFF)
SkipLogo: ON

; The screen scaled smooth through the linear filter, as the Classic
; draws it (ON), or sharp, each of the game's pixels the same size (OFF)
SmoothScaling: ON

; The screen scaled by whole multiples of itself, black around it
; (ON), or as large as the window's height or width takes it (OFF)
IntegerScaling: OFF

; Each picture shown on the display's vertical sync, the game paced by
; the display's refresh (ON), or shown as the game's own clock comes (OFF)
DisplaySync: ON

; The display the game opens on, numbered from 0 as the Classic numbers
; them, 0 the primary, which a number below 0 or past the last takes
DesiredDisplayNum: 0

; The Classic's controls, its bindings of the keys and of a pad, which
; the option menu's Controls set (ON), or the 1994 game's keys alone
; (OFF)
GamePad: ON
