; The settings of Little Big Adventure. The game reads lba.cfg from the
; preferences, else where its files lie, else beside the program, else
; from the program's own copy of this text, and writes its changes into
; the preferences. Its keys are the CD's LBA.CFG's.

; The texts' language, English, Français, Deutsch, Español or Italiano
Language: English

; The voices' language, English, Français or Deutsch, or None
LanguageCD: English

; The texts shown with the voices, ON or OFF
FlagDisplayText: ON

; The voices copied from the CD kept in VOX, ON or OFF
FlagKeepVoice: OFF

; The video card's driver LBA.EXE loads, VESA for its own
SvgaDriver: VESA

; The music's driver LBA.EXE loads, or NoMidi
MidiDriver: NoMidi

; A program LBA.EXE runs before the music's driver, or NoExec
MidiExec: NoExec

; The music card's port
MidiBase: 

; The tunes, FM or Midi
MidiType: 

; The music card's IRQ and DMA
MidiIRQ: 
MidiDMA: 

; The samples' driver LBA.EXE loads, or NoWave
WaveDriver: NoWave

; A program LBA.EXE runs before the samples' driver, or NoExec
WaveExec: NoExec

; The sound card's port
WaveBase: 

; The sound card's IRQ and DMA
WaveIRQ: 
WaveDMA: 

; The samples' rate, 12000 to 22000 Hz
WaveRate: 

; The mixer's driver LBA.EXE loads, or NoMixer
MixerDriver: NoMixer

; The mixer's port
MixerBase: 

; The volumes, 0 to 255
WaveVolume: 
MusicVolume: 
CDVolume: 
LineVolume: 
MasterVolume: 
