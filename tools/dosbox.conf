# dosbox-staging settings for running LBA.EXE and our DOS builds.
# tools/dosrun adds the mounts and the autoexec. Always loaded with
# --noprimaryconf --nolocalconf, so nothing of the desktop's own
# configuration applies.

[sdl]
fullscreen = false
# SDL's textures scaled to the nearest pixel (not texture's bilinear), so
# that a shot's pixels are the game's, for tools/framecmp.py
output = texturenb
texture_renderer = software

[dosbox]
machine = svga_s3
memsize = 16

[render]
integer_scaling = auto

[cpu]
core = normal
cpu_cycles_protected = 60000
cpu_throttle = false

[capture]
default_image_capture_formats = raw

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
oplmode = auto
